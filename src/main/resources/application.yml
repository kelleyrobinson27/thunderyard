spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/thunderyard
    username: thunderyard_user
    password: thisIsOverWrittenByApplicationLocalYmlFile
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jpa.show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        allow.auto.create.topics: true
    admin:
      fail-fast: false
      auto-create: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.thunderyard.demo.*"

  security:
    user:
      name: demo
      password: demo

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  retry:
    instances:
      sms:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.thunderyard.demo.sms.RetryableSmsException
      eas:
        max-attempts: 3
        wait-duration: 200ms
  circuitbreaker:
    instances:
      sms:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
      eas:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  timelimiter:
    instances:
      eas:
        timeout-duration: 2s
